<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Rocky Mountain Whitewater Rafting</title>
  <meta name="description" content="Contact Rocky Mountain Whitewater Rafting for inquiries, reservations, or customer support.">
  <meta name="author" content="Rayniel Elias Druyard Rojas">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Rocky Mountain Whitewater Rafting Logo" class="logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main class="contact-main">
    <!-- ENCABEZADO CON INFORMACIÓN DE CONTACTO -->
    <section class="company-info">
      <h1>Rocky Mountain Whitewater Rafting</h1>
      <p>123 Main River Street</p>
      <p>Kolob, California</p>
      <p>+1 999 999 9999</p>
      <p>info@whitewater.com</p>
    </section>

    <!-- SECCIÓN DE MAPA + FORMULARIO EN 2 COLUMNAS (USANDO DIV PARA VALIDACIÓN SEMÁNTICA W3C) -->
    <div class="contact-container">
      <div class="map-container">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d-122.4194155!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c6c8f4459%3A0xb10ed6d9b5050fa5!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1633000000000!5m2!1sen!2sus" 
          allowfullscreen="" 
          loading="lazy">
        </iframe>
      </div>

      <form class="contact-form">
        <div class="form-item">
          <label for="username">Name</label>
          <input type="text" id="username" name="username" placeholder="Your Name" required>
        </div>

        <div class="form-item">
          <label for="useremail">Email</label>
          <input type="email" id="useremail" name="useremail" placeholder="Your Email" required>
        </div>

        <div class="form-item radio-group">
          <label>Message Purpose</label>
          <div class="radio-options">
            <label for="purpose-general">
              <input type="radio" id="purpose-general" name="purpose" value="general" checked> General Inquiry
            </label>
            <label for="purpose-reservation">
              <input type="radio" id="purpose-reservation" name="purpose" value="reservation"> Reservation Question
            </label>
            <label for="purpose-suggestion">
              <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion"> Website Suggestion
            </label>
          </div>
        </div>

        <div class="form-item">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="Type here..."></textarea>
        </div>

        <div class="form-item checkbox-item">
          <label for="subscribe">
            <input type="checkbox" id="subscribe" name="subscribe" value="yes"> Please Subscribe me to the monthly newsletter
          </label>
        </div>

        <button type="submit" class="submit-btn">Get in Touch!</button>
      </form>
    </div>

    <!-- SECCIÓN EMPLEADOS EN 3 COLUMNAS HORIZONTALES -->
    <section class="employees-section">
      <h2>We Are Here to Serve You</h2>
      <div class="employees-grid">
        <figure>
          <img src="images/employee1.jpg" alt="Sarah Jenkins">
          <figcaption><strong>Sarah Jenkins</strong><br>Lead Guide</figcaption>
        </figure>
        <figure>
          <img src="images/employee2.jpg" alt="Michael Vance">
          <figcaption><strong>Michael Vance</strong><br>Safety Coordinator</figcaption>
        </figure>
        <figure>
          <img src="images/employee3.jpg" alt="Jessica Miller">
          <figcaption><strong>Jessica Miller</strong><br>Reservations Manager</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 | Rocky Mountain Whitewater Rafting | Rayniel Elias Druyard Rojas</p>
    <nav class="socialmedia">
      <a href="https://facebook.com" target="_blank">
        <img src="images/facebook.png" alt="Facebook Icon">
      </a>
      <a href="https://instagram.com" target="_blank">
        <img src="images/instagram.png" alt="Instagram Icon">
      </a>
      <a href="https://x.com" target="_blank">
        <img src="images/x-logo.png" alt="X / Twitter Icon">
      </a>
    </nav>
  </footer>
</body>
</html>
